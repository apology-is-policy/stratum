# A PROBE, never to be merged: the 9P client's storm test (a signal each 0.2 ms cutting its waits short) on one CPU of
#   ubuntu-24.04, alone and beside a busy competitor on that CPU, to see whether a test kept from its CPU by another
#   program gives its premise red (few signals, few looks, the whole ms between the looks near the time taken, given
#   up past the limit) with the client's give-up still within its bound, as one local run under a held machine did.
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  storm:
    name: storm / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build liburing-dev
          sudo apt-get remove -y libsodium-dev libsodium23 || true
          wget -q -O /tmp/libsodium.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: build the client test
        run: |
          cmake -B build -S . -GNinja -DSTM_SANITIZE=off -DSTM_ENABLE_IOURING=ON -DSTM_ENABLE_PQ=OFF
          cmake --build build --target test_9p_client
          find build -name test_9p_client -type f

      - name: the storm test on one CPU, alone and beside a competitor
        run: |
          set -u +e
          X=$(find build -name test_9p_client -type f | head -1)
          nproc; uptime
          run() {
            local tag=$1; shift
            local out; out=$(STM_TEST_ONLY=p9_client_wait_counts_waits_shorter_than_a_millisecond "$@" "$X" 2>&1); local rc=$?
            echo "$tag rc=$rc | $(printf '%s\n' "$out" | grep -a 'note: given up' | sed 's/ *note: //') | $(printf '%s\n' "$out" | grep -a -i -m3 'assert\|FAIL ' | tr '\n' ' ' | cut -c1-300)"
          }
          echo "=== control: pinned to CPU 0, nice 19, nothing else there"
          for i in 1 2 3 4 5; do run "alone-19" taskset -c 0 nice -n 19; done
          echo "=== a competitor spinning on CPU 0 at nice 0, the test at nice 19"
          taskset -c 0 sh -c 'while :; do :; done' & SPIN=$!
          sleep 1
          for i in 1 2 3 4 5; do run "beside-19" taskset -c 0 nice -n 19; done
          echo "=== the same competitor, the test at nice 0 (an equal share)"
          for i in 1 2 3 4 5; do run "beside-0" taskset -c 0 nice -n 0; done
          kill "$SPIN"; wait "$SPIN" 2>/dev/null
          echo "=== control again: alone at nice 19"
          for i in 1 2 3; do run "alone-19b" taskset -c 0 nice -n 19; done
          echo "=== the whole output of one run beside the competitor"
          taskset -c 0 sh -c 'while :; do :; done' & SPIN=$!
          sleep 1
          STM_TEST_ONLY=p9_client_wait_counts_waits_shorter_than_a_millisecond taskset -c 0 nice -n 19 "$X" 2>&1 | tail -20
          kill "$SPIN"; wait "$SPIN" 2>/dev/null
          true
