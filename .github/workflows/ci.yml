# A PROBE, never to be merged: what Linux says of two things macOS cannot show.
#   out=asking: the EINTR arm of the manager's own writer does not ask whether a stop came.
#   out=guard:  a stop for the terminal does not interrupt a line's write (StopsInterrupt out).
#   out=none:   the tree as it is, and what a close does to a read another thread waits in.
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  probe:
    name: probe / ${{ matrix.out }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        out: [none, asking, guard]
    steps:
      - uses: actions/checkout@v4

      - name: install deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake liburing-dev
          wget -q -O /tmp/libsodium.tar.gz \
              https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug \
              && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: take the asking out
        if: matrix.out == 'asking'
        run: |
          perl -0pi -e 's/                Some\(libc::EINTR\) => \{\n(.*\n){2}                    if stop_asked\(\) \{\n                        crate::embed::never_stop_for_the_terminal\(\);\n                    \}\n                    continue;\n                \}/                Some(libc::EINTR) => continue,/' tools/stratum/src/tui.rs
          git diff --stat
          if git diff --quiet; then echo "DID NOT APPLY"; exit 1; fi

      - name: take the guard out
        if: matrix.out == 'guard'
        run: |
          perl -0pi -e 's/    let _interrupted = crate::passphrase::StopsInterrupt::new\(\);\n//' tools/stratum/src/tui.rs
          git diff --stat
          if git diff --quiet; then echo "DID NOT APPLY"; exit 1; fi

      - name: build dist/stratum
        run: ./dist.sh

      - name: a manager stopped behind at a line of its own
        run: KEYS_ONLY=stopped_at_a_line_leg python3 tests/manager_keys.py dist/stratum

      - name: a close under a read another thread waits in
        if: always() && matrix.out == 'none'
        run: python3 tests/probe_close_under_recv.py
