# A PROBE, never to be merged: macos-15, where the manager's legs with standard output, and standard error,
#   given as /dev/tty failed in CI run 43584241627 (held 19 s) though they pass on a later macOS. It measures
#   /dev/tty there (ttyname, tcgetsid, a non-blocking write on a full terminal, poll's answer), then runs those
#   two legs with a log of what the manager opened and what each refused write and poll said, the manager
#   sampled where it is still there; and the unit test of an open of /dev/tty, logged too.
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  probe:
    name: probe / macos-15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          brew update
          brew install cmake pkg-config libsodium

      - name: build dist/stratum
        run: ./dist.sh

      - name: the machine
        run: |
          sw_vers
          uname -a
          sysctl -n hw.ncpu
          python3 --version

      - name: /dev/tty measured
        run: python3 -B tests/probe_devtty_facts.py

      - name: the two legs, logged
        if: always()
        env:
          STM_PROBE_LOG: /tmp/probe.log
          KEYS_ONLY: held_terminal_legs,headless_words_held_leg
        run: python3 -B tests/manager_keys.py dist/stratum || true

      - name: the log, per manager
        if: always()
        run: python3 -B tests/probe_log_summary.py /tmp/probe.log

      - name: where a held manager waits
        if: always()
        run: |
          for f in /tmp/sample-*.txt; do
            [ -f "$f" ] || continue
            echo "=== $f"
            grep -a -E 'Thread_|^ *\+ *[0-9]+ ' "$f" | grep -a -v -E '^ *\+ *[0-9]+ +[!:?]' | cut -c1-200 | head -120
          done

      - name: the unit test of an open of /dev/tty, logged
        if: always()
        env:
          STM_BUILD_DIR: ${{ github.workspace }}/build-dist
          STM_PROBE_LOG: /tmp/probe-unit.log
        run: |
          (cd tools/stratum && cargo test --release --bin stratum -- an_open_of_dev_tty dev_tty_is) || true
          head -40 /tmp/probe-unit.log 2>/dev/null | cut -c1-260
