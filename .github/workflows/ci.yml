# A PROBE, never to be merged: the storm test with its run NOT made again (the batch's w-18, its expression as the
#   batch has it), on one CPU of ubuntu-24.04 beside a busy program at a higher priority for its first run only: red
#   wanted at the premise after one run, where the test as it is passes on its second (probe 14).
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  storm:
    name: storm / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build liburing-dev
          sudo apt-get remove -y libsodium-dev libsodium23 || true
          wget -q -O /tmp/libsodium.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: the run not made again (w-18)
        run: |
          perl -0pi -e 's/        if \(!held \|\| floored_ms \+ WAIT_LIMIT_MS \/ 10u < WAIT_LIMIT_MS\) break;\n/        break;\n/' tests/test_9p_client.c
          git diff --stat -- tests/test_9p_client.c
          if git diff --quiet -- tests/test_9p_client.c; then echo "w-18 DID NOT APPLY"; exit 1; fi

      - name: build the client test
        run: |
          cmake -B build -S . -GNinja -DSTM_SANITIZE=off -DSTM_ENABLE_IOURING=ON -DSTM_ENABLE_PQ=OFF
          cmake --build build --target test_9p_client

      - name: beside a competitor for its first run
        run: |
          set -u +e
          X=$(find build -name test_9p_client -type f | head -1)
          export STM_TEST_ONLY=p9_client_wait_counts_waits_shorter_than_a_millisecond
          for i in 1 2 3 4 5; do
            taskset -c 0 sh -c 'while :; do :; done' & SPIN=$!
            sleep 0.5
            stdbuf -oL -eL taskset -c 0 nice -n 19 "$X" 2>&1 | while IFS= read -r l; do
              case "$l" in *'note: run 1:'*) kill "$SPIN" 2>/dev/null;; esac
              case "$l" in *'note: run'*|*'passed,'*|*FAIL*) echo "$l";; esac
            done
            kill "$SPIN" 2>/dev/null; wait "$SPIN" 2>/dev/null
            echo "--"
          done
          echo "=== alone (green wanted: on an idle CPU run 1 proves)"
          stdbuf -oL -eL taskset -c 0 nice -n 19 "$X" 2>&1 | grep -a 'note: run\|passed,\|FAIL'
          true
