# A PROBE, never to be merged: round 50's answers on macos-15 and ubuntu-24.04: the /dev/tty unit test's bound
#   on the loss alone (the give-up's time past the count), its time, count and tries printed by every run, the whole
#   suite's included; the fallback's open asserted not to wait and given up on a full terminal; poll_ms in
#   nanoseconds. Sleeps measured, the two /dev/tty legs, the unit tests, the /dev/tty test five times more, each
#   sabotage alone (the pause a sleep wanted red on macos-15, green on Linux).
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  probe-mac:
    name: probe / macos-15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          brew update
          brew install cmake pkg-config libsodium

      - name: build dist/stratum
        run: ./dist.sh

      - name: the machine
        run: |
          uname -a
          (sw_vers || cat /etc/os-release) 2>/dev/null | head -4
          (nproc || sysctl -n hw.ncpu) 2>/dev/null
          python3 --version

      - name: sleeps measured
        run: python3 -B tests/probe_sleeps.py

      - name: the two /dev/tty legs
        if: always()
        env:
          KEYS_ONLY: held_terminal_legs,headless_words_held_leg
        run: |
          for i in 1; do
            python3 -B tests/manager_keys.py dist/stratum > /tmp/legs-$i.log 2>&1; echo "run $i rc=$?"
            grep -a '^FAIL\|^PASS' /tmp/legs-$i.log | cut -c1-300
            grep -a 'with nothing read (' /tmp/legs-$i.log | cut -c1-260
          done

      - name: the unit tests
        if: always()
        env:
          STM_BUILD_DIR: ${{ github.workspace }}/build-dist
        run: |
          (cd tools/stratum && cargo test --release --bin stratum 2>&1) | tee /tmp/unit.log
          grep -a 'note: an open' /tmp/unit.log

      - name: the /dev/tty unit test five times more
        if: always()
        env:
          STM_BUILD_DIR: ${{ github.workspace }}/build-dist
        run: |
          cd tools/stratum
          for i in 1 2 3 4 5; do cargo test --release --bin stratum an_open_of_dev_tty 2>&1 | grep -a 'note: an open\|test result\|panicked'; done

      - name: each sabotage alone
        if: always()
        env:
          STM_BUILD_DIR: ${{ github.workspace }}/build-dist
        run: |
          set -u +e
          sab() {
            local name=$1 run=$2 want=$3 f=$4 e=$5
            cp "$f" /tmp/keep-file
            perl -0pi -e "$e" "$f"
            if cmp -s "$f" /tmp/keep-file; then echo "$name DID NOT APPLY"
            elif ! (cd tools/stratum && cargo build --release) > "/tmp/build-$name.log" 2>&1; then
              echo "$name DID NOT BUILD"; tail -20 "/tmp/build-$name.log"
            else
              case "$run" in
                unit:*) (cd tools/stratum && cargo test --release --bin stratum -- ${run#unit:}) > "/tmp/$name.log" 2>&1
                        echo "$name rc=$? (want red at: $want): matched=$(grep -acE -- "$want" "/tmp/$name.log") $(grep -a 'note: an open' "/tmp/$name.log" | head -2 | tr '\n' '|') $(grep -a -A1 'panicked' "/tmp/$name.log" | head -6 | tr '\n' '|' | cut -c1-700)";;
                *) KEYS_ONLY=$run python3 -B tests/manager_keys.py tools/stratum/target/release/stratum > "/tmp/$name.log" 2>&1
                   echo "$name rc=$? (want red at: $want): matched=$(grep -acE -- "$want" "/tmp/$name.log") $(grep -a '^FAIL' "/tmp/$name.log" | head -4 | tr '\n' '|' | cut -c1-600)";;
              esac
            fi
            cp /tmp/keep-file "$f"
            git diff --quiet -- tools tests || { echo "$name LEFT THE TREE CHANGED"; git diff --stat -- tools tests; git checkout -- tools tests; }
          }
          sab fl-48 'unit:an_open_of_dev_tty' 'counted: its waits ran late' tools/stratum/src/tui.rs 's/                unsafe \{ libc::poll\(std::ptr::null_mut\(\), 0, poll_ms\(short\)\) \};\n/                thread::sleep(short);\n/'
          sab fl-48a 'unit:an_open_of_dev_tty' 'counted: its waits ran late' tools/stratum/src/tui.rs 's/                unsafe \{ libc::poll\(std::ptr::null_mut\(\), 0, poll_ms\(short\)\) \};\n/                unsafe { libc::poll(std::ptr::null_mut(), 0, poll_ms(short * 3 \/ 2)) };\n/'
          sab fl-48b 'unit:a_wait_is_polled' 'rounded down: a wait under a millisecond would be none' tools/stratum/src/tui.rs 's/    libc::c_int::try_from\(wait\.as_nanos\(\)\.div_ceil\(1_000_000\)\)\.unwrap_or/    libc::c_int::try_from(wait.as_millis()).unwrap_or/'
          sab fl-49 'unit:dev_tty_stands_in' 'an open of it made again is none' tools/stratum/src/tui.rs 's/    if again < 0 && unsafe \{ libc::tcgetsid\(fd\) == libc::getsid\(0\) \} \{\n/    if again < 0 \&\& false {\n/'
          sab fl-49a 'unit:dev_tty_stands_in' 'node shut, an open of it made again is one of /dev/tty, the controlling terminal' tools/stratum/src/tui.rs 's/    if again < 0 && unsafe \{ libc::tcgetsid\(fd\) == libc::getsid\(0\) \} \{\n/    if again < 0 {\n/'
          sab fl-49b 'unit:dev_tty_stands_in' 'the open made again of /dev/tty waits in a write' tools/stratum/src/tui.rs 's/        again = unsafe \{ libc::open\(c"\/dev\/tty"\.as_ptr\(\), flags\) \};\n/        again = unsafe { libc::open(c"\/dev\/tty".as_ptr(), flags \& !libc::O_NONBLOCK) };\n/'
          sab fl-50 'unit:a_held_end_ends' 'term-waiting: the child ended' tools/stratum/src/tui.rs 's/    unsafe \{ libc::_exit\(held_end_code\(asked_by\(ASKED_BY\.load\(Ordering::Relaxed\)\)\)\) \}\n/    unsafe { libc::_exit(held_end_code(ASKED_BY.load(Ordering::Relaxed))) }\n/'
          sab fl-43 'unit:an_open_of_dev_tty' 'a poll that cannot watch it is not waited out longer each time' tools/stratum/src/tui.rs 's/                unwatched = \(unwatched \* 2\)\.min\(self\.tick\);\n/                unwatched = unwatched.min(self.tick);\n/'
          sab fl-44 'unit:an_open_of_dev_tty' 'an open made again of /dev/tty is none' tools/stratum/src/tui.rs 's/fn reopen_terminal\(fd: RawFd\) -> Option<RawFd> \{\n/fn reopen_terminal(fd: RawFd) -> Option<RawFd> {\n    if rdev_of(fd).is_some() \&\& rdev_of(fd) == dev_tty_rdev() {\n        return None;\n    }\n/'
          sab fl-45 'unit:a_held_end_reads' 'a TERM waiting while blocked is not the one that asked' tools/stratum/src/tui.rs 's/    if noted > 0 \{ noted \} else \{ waiting_stop\(\)\.unwrap_or\(0\) \}\n/    if noted > 0 { noted } else { 0 }\n/'

      - name: sleeps measured again, after the rest
        if: always()
        run: python3 -B tests/probe_sleeps.py

  probe-linux:
    name: probe / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake liburing-dev
          wget -q -O /tmp/libsodium.tar.gz \
              https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug \
              && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: build dist/stratum
        run: ./dist.sh

      - name: the machine
        run: |
          uname -a
          (sw_vers || cat /etc/os-release) 2>/dev/null | head -4
