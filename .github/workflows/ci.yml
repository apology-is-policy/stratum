# A PROBE, never to be merged: what a storm of signals looks like on the runners.
# The client's storm test asks for a signal each 0.2 ms. On macOS's runners a thread asked to sleep 0.2 ms
# slept some 2 ms (run 43411437377), and one waiting the pause out on the clock sent 261 signals in 300 ms
# under ASan (run 43415161455). Here, on macOS and Linux, plain and under ASan:
#   the storm probe (tests/probe_storm.c): each mode (sleep, yield, spin), one sender and three, twice;
#   the storm test with its premise taken from the client's own looks, five times;
#   and (out=floor) each wait floored to whole milliseconds, the regression the test is for, five times.
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  storm:
    name: storm / ${{ matrix.os }} / ${{ matrix.san }} / ${{ matrix.out }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        san: [off, asan]
        out: [none]
        include:
          - os: macos-15
            san: off
            out: floor
          - os: macos-15
            san: asan
            out: floor
          - os: ubuntu-24.04
            san: off
            out: floor
    steps:
      - uses: actions/checkout@v4

      - name: the machine
        run: |
          uname -a
          if [ "$(uname)" = Darwin ]; then sysctl -n hw.ncpu hw.physicalcpu machdep.cpu.brand_string; else nproc; fi
          uptime

      - name: build the storm probe
        run: |
          if [ "${{ matrix.san }}" = asan ]; then F="-O1 -g -fsanitize=address -fno-omit-frame-pointer"; else F="-O2"; fi
          cc $F -Wall -Wextra -pthread -o probe_storm tests/probe_storm.c

      - name: storms of three seconds, each mode, one sender and three, twice
        run: |
          for round in 1 2; do for mode in sleep yield spin; do for n in 1 3; do
            ./probe_storm $mode $n 3
          done; done; done
          PROBE_WAITER=sleep ./probe_storm yield 1 3

      - name: install deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install cmake ninja pkg-config libsodium

      - name: install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake liburing-dev
          wget -q -O /tmp/libsodium.tar.gz \
              https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug \
              && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: floor each wait to whole milliseconds
        if: matrix.out == 'floor'
        run: |
          perl -0pi -e 's/    uint64_t took = mono_ns\(\) - began;\n/    uint64_t took = (mono_ns() - began) \/ 1000000u * 1000000u;\n/' src/9p_client/9p_client.c
          git diff --stat -- src/9p_client/9p_client.c
          if git diff --quiet -- src/9p_client/9p_client.c; then echo "DID NOT APPLY"; exit 1; fi

      - name: build the client's tests
        run: |
          cmake -B build -S . -DSTM_SANITIZE=${{ matrix.san }} -DSTM_ENABLE_IOURING=OFF -DSTM_ENABLE_PQ=OFF -DSTM_WERROR=ON
          cmake --build build --target test_9p_client -j 3

      - name: the storm test, five times
        run: |
          for i in 1 2 3 4 5; do
            STM_TEST_ONLY=p9_client_wait_counts_waits_shorter_than_a_millisecond \
                ./build/tests/test_9p_client 2>&1 | grep -a 'note: given up\|FAIL\|passed' || true
          done

      - name: the client's tests
        if: always() && matrix.out == 'none'
        run: ./build/tests/test_9p_client
