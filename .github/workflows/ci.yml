                        echo "$name rc=$? (want red at: $want): matched=$(grep -acE -- "$want" "/tmp/$name.log") $(grep -a 'PROBE' "/tmp/$name.log" | head -2 | tr '\n' '|') $(grep -a -A1 'panicked' "/tmp/$name.log" | head -6 | tr '\n' '|' | cut -c1-700)";;
                *) KEYS_ONLY=$run python3 -B tests/manager_keys.py tools/stratum/target/release/stratum > "/tmp/$name.log" 2>&1
                   echo "$name rc=$? (want red at: $want): matched=$(grep -acE -- "$want" "/tmp/$name.log") $(grep -a '^FAIL' "/tmp/$name.log" | head -4 | tr '\n' '|' | cut -c1-600)";;
              esac
            fi
            cp /tmp/keep-file "$f"
            git diff --quiet -- tools tests || { echo "$name LEFT THE TREE CHANGED"; git diff --stat -- tools tests; git checkout -- tools tests; }
          }
