          sab fl-49 'unit:dev_tty_stands_in' 'an open of it made again is none' tools/stratum/src/tui.rs 's/    if again < 0 && unsafe \{ libc::tcgetsid\(fd\) == libc::getsid\(0\) \} \{\n/    if again < 0 \&\& false {\n/'
