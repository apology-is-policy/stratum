# A PROBE, never to be merged: the 9P client's storm test, now made again where its premise alone did not hold, on
#   one CPU of ubuntu-24.04: alone (green on its first run), beside a busy program at a higher priority for its first
#   run only (red premise on run 1, its bounds held, then green on run 2: the run made again), and beside it throughout
#   (red after three runs: a run that proves nothing never passes).
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  storm:
    name: storm / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake ninja-build liburing-dev
          sudo apt-get remove -y libsodium-dev libsodium23 || true
          wget -q -O /tmp/libsodium.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: build the client test
        run: |
          cmake -B build -S . -GNinja -DSTM_SANITIZE=off -DSTM_ENABLE_IOURING=ON -DSTM_ENABLE_PQ=OFF
          cmake --build build --target test_9p_client
          find build -name test_9p_client -type f

      - name: the storm test on one CPU, alone, beside a competitor for its first run, and throughout
        run: |
          set -u +e
          X=$(find build -name test_9p_client -type f | head -1)
          nproc; uptime
          export STM_TEST_ONLY=p9_client_wait_counts_waits_shorter_than_a_millisecond
          echo "=== alone, nice 19, pinned to CPU 0"
          for i in 1 2 3; do stdbuf -oL -eL taskset -c 0 nice -n 19 "$X" 2>&1 | grep -a 'note: run\|passed,\|FAIL'; done
          echo "=== a competitor on CPU 0 at nice 0 until the first run ends"
          for i in 1 2 3 4 5; do
            taskset -c 0 sh -c 'while :; do :; done' & SPIN=$!
            sleep 0.5
            stdbuf -oL -eL taskset -c 0 nice -n 19 "$X" 2>&1 | while IFS= read -r l; do
              case "$l" in *'note: run 1:'*) kill "$SPIN" 2>/dev/null;; esac
              case "$l" in *'note: run'*|*'passed,'*|*FAIL*) echo "$l";; esac
            done
            kill "$SPIN" 2>/dev/null; wait "$SPIN" 2>/dev/null
            echo "--"
          done
          echo "=== the competitor throughout"
          taskset -c 0 sh -c 'while :; do :; done' & SPIN=$!
          sleep 0.5
          for i in 1 2; do stdbuf -oL -eL taskset -c 0 nice -n 19 "$X" 2>&1 | grep -a 'note: run\|passed,\|FAIL'; echo "--"; done
          kill "$SPIN"; wait "$SPIN" 2>/dev/null
          true
