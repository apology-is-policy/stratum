# A PROBE, never to be merged: what Linux says of things macOS cannot show.
# One leg, a manager stopped behind at a line of its own, in three shapes, with one thing taken out:
#   out=asking: the EINTR arm of the manager's own writer does not ask whether a stop came.
#   out=guard:  a stop for the terminal does not interrupt a line's write (no StopsInterrupt).
#   out=twin:   the echo hold's stop is not taken over for the line (it restarts).
#   out=plain:  the plain write's loop does not ask.
#   out=none:   the tree as it is; and the guard's unit test, the leaving client, two signals at once.
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  probe:
    name: probe / ${{ matrix.out }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        out: [none, asking, guard, twin, plain]
    steps:
      - uses: actions/checkout@v4

      - name: install deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake liburing-dev
          wget -q -O /tmp/libsodium.tar.gz \
              https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug \
              && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: take the asking out
        if: matrix.out == 'asking'
        run: |
          perl -0pi -e 's/                Some\(libc::EINTR\) => \{\n(.*\n){2}                    if stop_asked\(\) \{\n                        crate::embed::never_stop_for_the_terminal\(\);\n                    \}\n                    continue;\n                \}/                Some(libc::EINTR) => continue,/' tools/stratum/src/tui.rs

      - name: take the guard out
        if: matrix.out == 'guard'
        run: |
          perl -0pi -e 's/    let _interrupted = crate::passphrase::StopsInterrupt::new\(\);\n//' tools/stratum/src/tui.rs

      - name: take the echo hold's twin out
        if: matrix.out == 'twin'
        run: |
          perl -0pi -e 's/            held if held == given_back => Some\(action\(stop_given_back_and_interrupt, 0\)\),\n//' tools/stratum/src/passphrase.rs

      - name: take the plain write's asking out
        if: matrix.out == 'plain'
        run: |
          perl -0pi -e 's/(                    Err\(e\) if e\.kind\(\) == io::ErrorKind::Interrupted => \{\n)                        if stop_asked\(\) \{\n                            crate::embed::never_stop_for_the_terminal\(\);\n                        \}\n/$1/' tools/stratum/src/tui.rs

      - name: what was taken out
        if: matrix.out != 'none'
        run: |
          git diff --stat
          if git diff --quiet; then echo "DID NOT APPLY"; exit 1; fi

      - name: build dist/stratum
        run: ./dist.sh

      - name: a manager stopped behind at a line of its own, three shapes
        run: KEYS_ONLY=stopped_at_a_line_leg python3 tests/manager_keys.py dist/stratum

      - name: the guard's unit test
        if: always() && matrix.out == 'none'
        working-directory: tools/stratum
        env:
          STM_BUILD_DIR: ${{ github.workspace }}/build-dist
        run: cargo test --release --bin stratum a_lines_guard

      - name: a client that leaves
        if: always() && matrix.out == 'none'
        run: python3 tests/stop_with_clients.py dist/stratum

      - name: two signals taken where a write comes back
        if: always() && matrix.out == 'none'
        run: |
          cc -O2 -o /tmp/two-signals tests/probe_two_signals.c
          /tmp/two-signals 20000
          /tmp/two-signals 20000

  # What a step's process inherits of each signal, and what an exec keeps of a signal's flags
  # when it resets the handler: the unit test of the line's guard failed its premise on macOS.
  inherited:
    name: inherited / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: what a step inherits, and what an exec keeps
        run: |
          cc -O2 -o /tmp/exec-flags tests/probe_exec_flags.c
          /tmp/exec-flags
