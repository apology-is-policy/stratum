# A PROBE, never to be merged: the legs of the tip that only Linux can turn red, on ubuntu-24.04.
#   The tip as it is: the started-behind cases, the hangup with no standard descriptor a terminal, the hold's
#   sets with nothing read, and the headless terminal filled from the side (green wanted).
#   Then each sabotage alone, applied, built, run and restored: the watcher's copy out (red at the hangup
#   wanted); the screen's set at fg asking nothing after (red at the INT-then-fg case); the headless daemons'
#   words as they were, the headless stop not counted as leaving, its signal not noted (each red at the
#   filled terminal wanted).
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  legs:
    name: legs / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config cmake liburing-dev
          wget -q -O /tmp/libsodium.tar.gz \
              https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar xzf /tmp/libsodium.tar.gz -C /tmp
          (cd /tmp/libsodium-1.0.20 && ./configure --prefix=/usr/local --disable-debug \
              && make -j"$(nproc)" && sudo make install)
          sudo ldconfig

      - name: build dist/stratum
        run: ./dist.sh

      - name: the machine
        run: |
          nproc
          uptime

      - name: the legs, the tip as it is
        run: |
          KEYS_ONLY=screen_started_behind_leg,no_terminal_hangup_leg,unread_hold_sets_leg,headless_words_held_leg \
              python3 -B tests/manager_keys.py dist/stratum

      - name: each sabotage alone
        if: always()
        env:
          STM_BUILD_DIR: ${{ github.workspace }}/build-dist
        run: |
          set -u
          sab() {
            local name=$1 file=$2 expr=$3 legs=$4
            cp "$file" /tmp/keep
            perl -0pi -e "$expr" "$file"
            if cmp -s "$file" /tmp/keep; then echo "$name DID NOT APPLY"; return; fi
            if ! (cd tools/stratum && cargo build --release) > "/tmp/build-$name.log" 2>&1; then
              echo "$name DID NOT BUILD"; tail -20 "/tmp/build-$name.log"; cp /tmp/keep "$file"; return
            fi
            KEYS_ONLY=$legs python3 -B tests/manager_keys.py tools/stratum/target/release/stratum > "/tmp/$name.log" 2>&1
            echo "$name rc=$? (want red): $(grep -a '^FAIL' "/tmp/$name.log" | head -4 | tr '\n' '|' | cut -c1-500)"
            cp /tmp/keep "$file"
          }
          TU=tools/stratum/src/tui.rs; EM=tools/stratum/src/embed.rs
          sab fl-27 $TU 's/    let copy = watch_copy\(tty, &ttys\);\n/    let copy: Option<std::os::fd::OwnedFd> = None;\n/' no_terminal_hangup_leg
          sab fl-25 $TU 's/        Ok\(true\) if stop_asked\(\) => \{\n/        Ok(true) if false => {\n/' screen_started_behind_leg
          sab fl-28 $EM 's/            return Ok\(tui::daemon_words_out\(\)\.map_or_else\(Stdio::inherit, Stdio::from\)\);\n/            return Ok(Stdio::inherit());\n/' headless_words_held_leg
          sab fl-29 $EM 's/    tui::leave_for_good\(sig\);\n//' headless_words_held_leg
          sab fl-30 $TU 's/    if sig > 0 \{\n        let _ = ASKED_BY/    if false {\n        let _ = ASKED_BY/' headless_words_held_leg
          for n in fl-27 fl-28; do echo "=== $n"; grep -a '^ok\|^FAIL\|^note\|^PASS' "/tmp/$n.log" | cut -c1-300; done
