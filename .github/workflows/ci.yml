# A PROBE, never to be merged: macos-15 again. Probe 17 found /dev/tty there as on a later macOS and both opens
#   giving up, yet the screen's case took 15 s and the headless one held in stop_child. This measures how long a
#   100 ms nanosleep and a 100 ms poll timeout take there, then runs the two legs twice with a timestamped log
#   (each manager's wall time from the asking to the give-up against the wait it counted), the held manager and
#   its daemons sampled, their states and descriptors 0-2 listed.
name: ci

on:
  push:
    branches: ['ci/**']

jobs:
  probe:
    name: probe / macos-15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          brew update
          brew install cmake pkg-config libsodium

      - name: build dist/stratum
        run: ./dist.sh

      - name: the machine
        run: |
          sw_vers
          uname -a
          sysctl -n hw.ncpu
          python3 --version

      - name: sleeps measured
        run: python3 -B tests/probe_sleeps.py

      - name: the two legs, logged
        if: always()
        env:
          STM_PROBE_LOG: /tmp/probe.log
          KEYS_ONLY: held_terminal_legs,headless_words_held_leg
        run: |
          python3 -B tests/manager_keys.py dist/stratum || true
          python3 -B tests/manager_keys.py dist/stratum || true

      - name: the log, per manager
        if: always()
        run: python3 -B tests/probe_log_summary.py /tmp/probe.log

      - name: where a held manager waits
        if: always()
        run: |
          for f in /tmp/held-*.txt; do
            [ -f "$f" ] || continue
            echo "=== $f"; cut -c1-200 "$f" | head -60
          done
          for f in /tmp/sample-*.txt; do
            [ -f "$f" ] || continue
            echo "=== $f"
            grep -a -E 'Thread_|^ *\+ ' "$f" | cut -c1-180 | head -60
          done

      - name: sleeps measured again, after the legs
        if: always()
        run: python3 -B tests/probe_sleeps.py
