\* Stratum OPEN-BUGS (ah) review round 3 F4 -- the code's retry with a fault.
\*
\* quorum_faults.cfg's bounds (MaxFaults 1: a device can fault at any step,
\* crash and remount included, and rejoin) with a retried final that need
\* not repeat the first attempt's bytes (IdempotentRetry = FALSE), as the
\* code's does after a write or a sweep between the attempts or on the
\* first commit after an open, acknowledged on one write's confirmations
\* (StrictFinal = TRUE). Every invariant must hold.
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_faults_retry.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3}
    MaxCommits         = 2
    MaxFaults          = 1
    MaxRetries         = 1
    IdempotentRetry    = FALSE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree = TRUE
    RingRead          = TRUE
    RingCountsHidden  = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
    ContentQuorumAtGen
    MountNotStuck
    MountIntact
    NewestNearAuth
