SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyLinkBeforeInit: insert links the fresh entry into its hash
\* bucket BEFORE initializing it (the torn-entry publish). A concurrent
\* reader's bucket walk observes the half-built entry.
\* Expected: trips NoTornEntry (the reader-visible hazard).
\* LinkedImpliesInit — which this bug violates trivially in one step,
\* without any reader — is deliberately NOT checked here so the
\* counterexample trace shows the reader looking up the torn entry.
CONSTANTS
    ReaderThreads          = {r0, r1}
    MaxEntries             = 3
    MaxGlobalEpoch         = 12
    BuggyEvictFreesPinned  = FALSE
    BuggyLinkBeforeInit    = TRUE
    BuggyRetireStillLinked = FALSE

INVARIANT TypeOK
INVARIANT NoUseAfterReclaim
INVARIANT NoTornEntry
INVARIANT LinkedNeverReclaimed
INVARIANT RingConsistent
