SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE

\* RC-1 clean model: 2 readers, 3 fresh entries, epoch budget
\* 3*MaxEntries + 3 (gated advances cannot burn it idle — see the
\* module header). Checks all safety invariants plus the liveness
\* witness (every retired entry is eventually reclaimed).
CONSTANTS
    ReaderThreads          = {r0, r1}
    MaxEntries             = 3
    MaxGlobalEpoch         = 12
    BuggyEvictFreesPinned  = FALSE
    BuggyLinkBeforeInit    = FALSE
    BuggyRetireStillLinked = FALSE

INVARIANT TypeOK
INVARIANT NoUseAfterReclaim
INVARIANT NoTornEntry
INVARIANT LinkedImpliesInit
INVARIANT LinkedNeverReclaimed
INVARIANT RingConsistent

PROPERTY EventuallyReclaimed
