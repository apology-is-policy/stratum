\* Stratum OPEN-BUGS (ah) review round 1 F4 -- MountIntact's red control.
\*
\* RingCountsHidden = FALSE (as quorum_hidden_buggy.cfg): a device moved
\* past the mount's gen whose slot the open could not read counts nothing,
\* so the open takes an orphan beside the acknowledged claim whose open
\* freed its nodes. With MountIntact the only invariant, TLC MUST report
\* "Invariant MountIntact is violated".
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_intact_buggy.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3}
    MaxCommits         = 2
    MaxFaults          = 1
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE
    RingRead           = TRUE
    RingCountsHidden   = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    MountIntact
