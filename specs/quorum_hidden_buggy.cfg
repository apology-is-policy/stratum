\* Stratum OPEN-BUGS (ah) demonstration -- the ring read blind to a slot it
\* could not read.
\*
\* RingCountsHidden = FALSE: a device moved past the mount's gen whose slot
\* of that gen the open could not read counts as having confirmed nothing
\* there. TLC MUST report "Invariant MountKeepsPublished is violated": the
\* acknowledged claim's devices moved on, their slots unread but one,
\* beside an orphan final, and the open takes the orphan.
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_hidden_buggy.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3}
    MaxCommits         = 2
    MaxFaults          = 1
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE
    RingRead           = TRUE
    RingCountsHidden   = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
    ContentQuorumAtGen
    MountNotStuck
