\* Stratum (r) round 1 F2 -- the mount's content pick, four devices.
\*
\* With four devices (quorum 3) two devices can sit at exactly the gen a
\* mount takes, fewer than quorum, holding different contents: an orphan
\* final whose commit failed, and the claim a later mount acknowledged on
\* three devices (the other two moved past it). MinorityMustAgree = TRUE:
\* the mount refuses while they disagree. Every invariant must hold,
\* MountKeepsPublished among them; quorum_pick_buggy.cfg is the same
\* model taking either, which TLC must fail. ContentQuorumAtGen is left
\* out as in quorum_faults.cfg (OPEN-BUGS (ah)).
CONSTANTS
    Devices            = {1, 2, 3, 4}
    MaxCommits         = 2
    MaxFaults          = 1
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
