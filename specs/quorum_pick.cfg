\* Stratum (r) round 1 F2 -- the mount's content pick, four devices.
\*
\* With four devices (quorum 3) two devices can sit at exactly the gen a
\* mount takes, fewer than quorum, holding different contents: an orphan
\* final whose commit failed, and the claim a later mount acknowledged on
\* three devices, two of which moved past it. RingRead = TRUE: the
\* mount reads the slot of that gen on the devices moved past it, which
\* hold the claim (OPEN-BUGS (ah)). Every invariant must hold,
\* MountKeepsPublished and MountNotStuck among them; quorum_pick_buggy.cfg
\* is the newest-only model taking either, which TLC must fail.
\* MaxCommits = 2: the claim is written device by device, so two commits
\* reach the shape: a claim acknowledged on three devices, the next
\* commit's final on the fourth only, a crash, a claim over it
\* acknowledged on the other three, the next reservation on two of them,
\* a crash. MaxFaults = 0: the shape needs no fault.
\* quorum_pick_faults.cfg adds a fault and a third commit and runs for
\* hours, so it is checked outside CI; quorum_faults.cfg checks the
\* unknown votes on three devices.
CONSTANTS
    Devices            = {d1, d2, d3, d4}
    MaxCommits         = 2
    MaxFaults          = 0
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE
    RingRead           = TRUE
    RingCountsHidden   = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
    ContentQuorumAtGen
    MountNotStuck
    MountIntact
    NewestNearAuth
