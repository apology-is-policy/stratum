SPECIFICATION Spec

\* The sweep ignores a send's pins: a range it collected is overwritten,
\* and two commits make it FREE for another write while the send still
\* reads it. TLC must report SendBlocksKept violated.
CONSTANTS
    Ranges     = {r1, r2}
    Owners     = {main, s1}
    MainOwner  = main
    MaxGen     = 3
    UnreserveChecksWritten = TRUE
    AuthStampedFrees = FALSE
    SweepHonoursPins = FALSE
    SweepHonoursBarrier = TRUE
    BarrierByOrder = TRUE
    DeindexBeforeFree = TRUE

INVARIANTS
    Invariants
