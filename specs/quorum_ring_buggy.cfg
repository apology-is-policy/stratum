\* Stratum OPEN-BUGS (ah) demonstration -- the open before the ring read.
\*
\* RingRead = FALSE: the open reads each device's newest uberblock only;
\* a quorum of those at exactly the gen it mounts must share a content,
\* and fewer must all agree. TLC MUST report "Invariant MountNotStuck is
\* violated": every device online, no coordinator in flight, and no open
\* can mount. The shortest trace needs no fault: a commit's final reached
\* one device, the next open's claim another, and a crash: two of three
\* sit at gen g, the orphan final and the claim, and neither was
\* acknowledged (15 states). The other shape: a claim acknowledged at g,
\* one of its devices moved on to g + 1, beside an orphan final at g on
\* the device that missed the claim, though a quorum's slots of g hold it.
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_ring_buggy.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3}
    MaxCommits         = 2
    MaxFaults          = 1
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE
    RingRead           = FALSE
    RingCountsHidden   = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
    ContentQuorumAtGen
    MountNotStuck
