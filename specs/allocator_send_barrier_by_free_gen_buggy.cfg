SPECIFICATION Spec

\* The barrier keeps by free_gen (free_gen >= the gen it went up at): a
\* free stamped with the authoritative gen, as the evacuation paths
\* stamp, falls below it and is swept while the send collects. TLC must
\* report SendBlocksKept violated.
CONSTANTS
    Ranges     = {r1, r2}
    Owners     = {main, s1}
    MainOwner  = main
    MaxGen     = 3
    UnreserveChecksWritten = TRUE
    AuthStampedFrees = TRUE
    SweepHonoursPins = TRUE
    SweepHonoursBarrier = TRUE
    BarrierByOrder = FALSE

INVARIANTS
    Invariants
