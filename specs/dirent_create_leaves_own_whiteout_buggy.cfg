\* BUGGY: Create installs at the first EMPTY/TOMBSTONE of the chain even
\* when its own name's whiteout sits further along. With n_a and n_b
\* colliding at slot 0: create n_a, create n_b (slot 1), unlink n_a
\* (tombstone at 0), whiteout n_b (whiteout at 1), create n_b -> the new
\* record lands on the tombstone and the whiteout stays: n_b is listed
\* twice, and an unlink of it would bring the whiteout back.
\*
\* Expected verdict: Invariants violated (WhiteoutsAgreeWithOracle and
\* WhiteoutSlotShape) in 6 steps.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Dirs                                = {d1}
    Names                               = {"n_a", "n_b", "n_c"}
    Inos                                = {ino_1, ino_2}
    MaxGen                              = 1
    MaxProbe                            = 3
    Hash                                <- HashAB_C
    NONE                                = NONE
    BuggyUnlinkUsesEmpty                = FALSE
    BuggyCreateOverwritesNoProbe        = FALSE
    BuggyLookupStopsOnTombstone         = FALSE
    BuggyReaddirIncludesTombstones      = FALSE
    BuggyReaddirNoCursorAdvance         = FALSE
    BuggyReaddirSkipsLiveRecord         = FALSE
    EnableWhiteoutModel                 = TRUE
    BuggyWhiteoutDropsName              = FALSE
    BuggyLookupReturnsRecordOnWhiteout  = FALSE
    EnableSwapFailModel                 = FALSE
    BuggySwapHalfUnreported             = FALSE
    BuggyCreateLeavesOwnWhiteout        = TRUE

INVARIANTS
    Invariants
