\* Stratum vote 153 -- the quorum model with a device fault.
\*
\* MaxFaults = 1: a device can fault (FAULTED: it refuses I/O, so a mount
\* cannot read it) at any step, crash and remount included, and rejoin.
\* MountCountsUnknown = TRUE: the mount reads the ONLINE devices only and
\* refuses while the faulted device's unknown vote could raise the
\* authoritative gen. Every invariant must hold, MountAtAuthoritative
\* among them; quorum_mount_buggy.cfg is the same model without the
\* refusal, which TLC must fail; MountKeepsPublished must hold too.
\* Invariants are listed one by one so a
\* violation names its own.
\*
\* ContentQuorumAtGen is left out: under a fault it fails (OPEN-BUGS (ah):
\* a minority orphan at the claim's gen, and the claim's quorum member
\* moved past it, leave two devices at exactly that gen that disagree;
\* the implementation's content check refuses STM_EQUORUM there). It holds
\* in quorum.cfg (no faults).
CONSTANTS
    Devices            = {1, 2, 3}
    MaxCommits         = 2
    MaxFaults          = 1
    MaxRetries         = 1
    IdempotentRetry    = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
