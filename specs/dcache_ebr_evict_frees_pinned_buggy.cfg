SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyEvictFreesPinned: evict frees the entry + plaintext buffer
\* immediately, skipping the EBR retire ring — the UAF RC-1 exists to
\* close (rc-design section 6). A pinned reader that looked the entry
\* up is now copying from freed memory.
\* Expected: trips NoUseAfterReclaim.
CONSTANTS
    ReaderThreads          = {r0, r1}
    MaxEntries             = 3
    MaxGlobalEpoch         = 12
    BuggyEvictFreesPinned  = TRUE
    BuggyLinkBeforeInit    = FALSE
    BuggyRetireStillLinked = FALSE

INVARIANT TypeOK
INVARIANT NoUseAfterReclaim
INVARIANT NoTornEntry
INVARIANT LinkedImpliesInit
INVARIANT LinkedNeverReclaimed
INVARIANT RingConsistent
