SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyRetireBeforePublish: writer retires superseded nodes
\* WITHOUT swapping mvcc_root in the same step. mvcc_root keeps
\* pointing at the old tree whose nodes are now in the retire
\* ring; next epoch advance reclaims them while the tree is
\* nominally still published. Expected: trips
\* RootAlwaysReachable (the published root's tree intersects
\* reclaimed).
CONSTANTS
    ReaderThreads             = {r0, r1}
    MaxNodes                  = 4
    MaxCommits                = 2
    MaxGlobalEpoch            = 5
    BuggyRetireBeforePublish  = TRUE
    BuggyImmediateFree        = FALSE
    BuggyNoPublish            = FALSE

INVARIANT TypeOK
INVARIANT RootAlwaysReachable
INVARIANT ReaderObservesCoherentTree
INVARIANT ReclaimBookkeeping
INVARIANT ReaderEpochStable
