SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyInplaceMutate: mutators write the PUBLISHED map in place —
\* today's sync_dek_insert / sync_dek_remove_at (swap-with-last) minus
\* `s->lock`. A reader that matched dek d at slot i loads the dek the
\* swap moved into i: WRONG KEY MATERIAL.
\* Expected: trips ReaderGetsWanted (find d1 at slot 1; evict d1 swaps
\* d2 into slot 1; the reader's load returns d2).
CONSTANTS
    ReaderThreads       = {r0, r1}
    MaxDeks             = 3
    MaxSlots            = 3
    MaxMaps             = 4
    MaxMuts             = 3
    MaxGlobalEpoch      = 12
    BuggyInplaceMutate  = TRUE
    BuggyFreeOldMap     = FALSE
    BuggyEvictNoPublish = FALSE

INVARIANT TypeOK
INVARIANT ReaderGetsWanted
INVARIANT ReaderMapAlive
INVARIANT PublishedAlive
INVARIANT PublishedExcludesEvicted
INVARIANT MapRingConsistent
