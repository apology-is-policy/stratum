\* Buggy variant: Acquire adds its record beside the owner's overlapping
\* ones instead of replacing them -- the earlier table, under which
\* SQLite's EXCLUSIVE-to-SHARED downgrade left the exclusive record in
\* place. OwnRecordsDisjoint fires at the first overlapping re-lock.
\* Runtime twin: test_locks.c's locks_downgrade_admits_other_readers and
\* locks_sqlite_lock_sequence.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 2
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyAcquireStacks         = TRUE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseDropsNothing   = FALSE
    BuggyReleaseInoBlind       = FALSE
    BuggyReleaseExactOnly      = FALSE

INVARIANTS
    TypeOK
    NoConflictingLocks
    ExclusiveExcludesDifferentOwner
    OwnLocksNeverRefuse
    DifferentInosNeverInteract
    OwnRecordsDisjoint

PROPERTY
    HeldBytesExact
