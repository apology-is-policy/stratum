\* TLY-A2: crash-propagation bug. BuggyCrashPropagates = TRUE enables
\* CrashWedgesCoord.
\*
\* Configuration: standard pattern sets + coord policy. Any
\* CrashWedgesCoord(c) firing flips coord_wedged = TRUE AND sets
\* wedge_cause = "Crash" — TLC fires ClientCrashIsolation within a
\* few states.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Clients                = {c1, c2}
    Uids                   = {0, 1, 2}
    Datasets               = {sys, m, s}
    ClientUid              = [c1 |-> 1, c2 |-> 2]
    ClientPattern          = [c1 |-> {m}, c2 |-> {s}]
    CoordPolicy            = [0 |-> {sys}, 1 |-> {m}, 2 |-> {s}]
    MaxAttaches            = 1
    NoOwner                = NoOwner
    NoCause                = NoCause
    BuggyPatternSkipped    = FALSE
    BuggyAliasedFids       = FALSE
    BuggyCrashPropagates   = TRUE

INVARIANTS
    AllInvariants
