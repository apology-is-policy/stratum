\* BuggyOverFree: a commit frees the shared sibling leaf, which the new
\* root still reaches. Expected: trips FreedNodesNotReachable.
SPECIFICATION Spec
CONSTANTS
  MaxBegins = 3
  MaxContent = 2
  BuggyPartialCow = FALSE
  BuggyEarlyPublish = FALSE
  BuggyOverFree = TRUE
INVARIANT TypeOK
INVARIANT DurableTreeWellFormed
INVARIANT CommittedTreeMerkleConsistent
INVARIANT FreedNodesNotReachable
