SPECIFICATION Spec

\* A last free comes while a tree still names the range (DeindexBeforeFree
\* FALSE), as a rollback once freed blocks of the newer snapshots it then
\* deleted: the free precedes the barrier, the collect finds the record,
\* and two commits sweep the range. TLC must report SendBlocksKept violated.
CONSTANTS
    Ranges     = {r1, r2}
    Owners     = {main, s1}
    MainOwner  = main
    MaxGen     = 3
    UnreserveChecksWritten = TRUE
    AuthStampedFrees = FALSE
    SweepHonoursPins = TRUE
    SweepHonoursBarrier = TRUE
    BarrierByOrder = TRUE
    DeindexBeforeFree = FALSE

INVARIANTS
    Invariants
