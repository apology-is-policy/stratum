SPECIFICATION Spec

\* The sweep ignores a send's barrier: a range it collected goes PENDING
\* before the pins and is swept in that window. TLC must report
\* SendBlocksKept violated.
CONSTANTS
    Ranges     = {r1, r2}
    Owners     = {main, s1}
    MainOwner  = main
    MaxGen     = 3
    UnreserveChecksWritten = TRUE
    AuthStampedFrees = FALSE
    SweepHonoursPins = TRUE
    SweepHonoursBarrier = FALSE
    BarrierByOrder = TRUE

INVARIANTS
    Invariants
