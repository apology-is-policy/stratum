\* TLY-A2: cross-conn fid-aliasing bug. BuggyAliasedFids = TRUE enables
\* CrossClientOp.
\*
\* Configuration: c1 and c2 each have their own dataset (m / s). After
\* both attach, CrossClientOp lets c1 fire an op on c2's dataset (or
\* vice versa). TLC fires CrossClientIsolation via the audit shadow
\* recording last_op_client[c1] = c2.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Clients                = {c1, c2}
    Uids                   = {0, 1, 2}
    Datasets               = {sys, m, s}
    ClientUid              = [c1 |-> 1, c2 |-> 2]
    ClientPattern          = [c1 |-> {m}, c2 |-> {s}]
    CoordPolicy            = [0 |-> {sys}, 1 |-> {m}, 2 |-> {s}]
    MaxAttaches            = 1
    NoOwner                = NoOwner
    NoCause                = NoCause
    BuggyPatternSkipped    = FALSE
    BuggyAliasedFids       = TRUE
    BuggyCrashPropagates   = FALSE

INVARIANTS
    AllInvariants
