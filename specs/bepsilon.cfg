SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* Smallest instance that exhibits per-target routing + buffer
\* batching + flush reordering: two keys, one per leaf; two
\* values so an Insert(k, a) followed by Insert(k, b) can race a
\* flush; small buffer + small op budget for tractable state
\* space (a few seconds on one core).
\*
\* CHECK_DEADLOCK FALSE — once op_count hits MaxOps and the
\* buffer drains, no action is enabled; this is a valid
\* completion, not a deadlock.
CONSTANTS
    Keys              = {1, 2}
    Values            = {a, b}
    Sep               = 2
    MaxBufferSize     = 2
    MaxOps            = 3
    BuggyFlushReorders = FALSE
    BuggyFlushDrops    = FALSE
    BuggyOverflow      = FALSE

INVARIANTS
    Invariants
