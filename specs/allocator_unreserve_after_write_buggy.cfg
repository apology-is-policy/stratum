SPECIFICATION Spec

\* Unreserve without its guard hands back a range already written: it is
\* allocated and written again at the same generation, sealing other bytes
\* under the same nonce. TLC must report NonceNeverReused violated.
CONSTANTS
    Ranges     = {r1, r2}
    Owners     = {main, s1}
    MainOwner  = main
    MaxGen     = 2
    UnreserveChecksWritten = FALSE

INVARIANTS
    Invariants
