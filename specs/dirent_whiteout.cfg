\* P8-POSIX-9b: healthy whiteout-enabled config.
\*
\* Same Hash + Names + Inos as dirent.cfg (3 names, 2 inos, MaxProbe=3).
\* `EnableWhiteoutModel = TRUE` enables the Whiteout action; every
\* buggy variant is FALSE.
\*
\* Expected verdict: TLC explores Create + Unlink + Whiteout +
\* Readdir interleavings without firing any invariant (727,255
\* distinct states, depth 24). WhiteoutSlotShape,
\* WhiteoutsAgreeWithOracle and ReaddirEmitsWhiteoutsAtEnd hold by
\* construction of the healthy Whiteout action, Create's own-whiteout
\* install slot and the readdir whiteout-emit branch. (Before Create
\* took the name's own whiteout, this config failed in 6 steps: a
\* re-create landed on an earlier tombstone and left the whiteout --
\* now dirent_create_leaves_own_whiteout_buggy.cfg.)
\*
\* The buggy variants that run with the whiteout model:
\*   - dirent_whiteout_drops_name_buggy.cfg -- Whiteout writes a
\*     TOMBSTONE; fires WhiteoutsAgreeWithOracle.
\*   - dirent_create_leaves_own_whiteout_buggy.cfg -- Create lands on
\*     an earlier tombstone; fires WhiteoutsAgreeWithOracle and
\*     WhiteoutSlotShape.
\*   - dirent_lookup_returns_record_on_whiteout_buggy.cfg flips
\*     BuggyLookupReturnsRecordOnWhiteout = TRUE; expected to
\*     fire LookupAgreesWithLinks (the abstract oracle says
\*     `links` doesn't contain the whiteout's name, so Lookup
\*     should return NONE; under the bug, Lookup returns
\*     <<"_", 0>> which doesn't equal NONE).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Dirs                                = {d1}
    Names                               = {"n_a", "n_b", "n_c"}
    Inos                                = {ino_1, ino_2}
    MaxGen                              = 1
    MaxProbe                            = 3
    Hash                                <- HashAB_C
    NONE                                = NONE
    BuggyUnlinkUsesEmpty                = FALSE
    BuggyCreateOverwritesNoProbe        = FALSE
    BuggyLookupStopsOnTombstone         = FALSE
    BuggyReaddirIncludesTombstones      = FALSE
    BuggyReaddirNoCursorAdvance         = FALSE
    BuggyReaddirSkipsLiveRecord         = FALSE
    EnableWhiteoutModel                 = TRUE
    BuggyWhiteoutDropsName              = FALSE
    BuggyLookupReturnsRecordOnWhiteout  = FALSE
    EnableSwapFailModel                 = FALSE
    BuggySwapHalfUnreported             = FALSE
    BuggyCreateLeavesOwnWhiteout        = FALSE

INVARIANTS
    Invariants
