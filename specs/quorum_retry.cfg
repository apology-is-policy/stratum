\* Stratum OPEN-BUGS (ah) review round 1 F4 -- the code's retry.
\*
\* A final the code failed to write is rebuilt before it is written again,
\* so a retried final need not repeat the first attempt's bytes
\* (IdempotentRetry = FALSE), and the code acknowledges a final on one
\* write's confirmations (StrictFinal = TRUE): a quorum holding this
\* attempt's content. Every invariant holds; quorum_buggy.cfg is the same
\* retry acknowledged on a quorum at the gen, whatever it holds.
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_retry.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3}
    MaxCommits         = 2
    MaxFaults          = 0
    MaxRetries         = 1
    IdempotentRetry    = FALSE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE
    RingRead           = TRUE
    RingCountsHidden   = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
    ContentQuorumAtGen
    MountNotStuck
    MountIntact
    NewestNearAuth
