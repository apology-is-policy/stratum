\* The failed-swap model enabled, healthy. A swap whose second slot
\* write fails either leaves the slots as they were (the first record
\* put back) or reports the half swap (torn), after which nothing runs.
\*
\* Expected verdict: no invariant violation. IndexFaithfulUnlessTorn
\* holds because every unreported outcome leaves the slots unchanged.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Dirs                                = {d1}
