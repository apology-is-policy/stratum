\* TLY-A3-keyslot-wrap buggy config — demonstrates the failure mode
\* UnwrapUsesWrapBinding exists to catch.
\*
\* BuggyUnwrapWrongPath = TRUE enables the MountResolveOkWrongPath
\* action: a CORVUS-wrapped dataset resolves to MOUNTED but with a
\* path that is NOT the binding the slot's WRAP recorded — modeling
\* the real-impl hazard of sending corvus the numeric dataset_id (or
\* any other wrong identifier) instead of the slot's stored UTF-8
\* dataset-path string. corvus's envelope-AEAD-AD check would reject
\* such an UNWRAP, making the pool unmountable. TLC trips
\* UnwrapUsesWrapBinding and the counterexample trace is a dataset
\* with unwrap_path = "DECIMAL" (the WRONG_PATH sentinel) while
\* mount = MOUNTED.
\*
\* BuggyServeBeforeResolve is FALSE here — this config isolates the
\* wrong-path failure mode. Same Datasets / MaxKeyId / MaxRefs bounds
\* as the fixed config.
CONSTANTS
    Datasets  = {0, 1}
    MaxKeyId  = 3
    MaxRefs   = 2
    BuggyServeBeforeResolve = FALSE
    BuggyUnwrapWrongPath    = TRUE

SPECIFICATION Spec

INVARIANT Invariants
