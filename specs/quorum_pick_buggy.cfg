\* Stratum (r) round 1 F2 demonstration -- the content pick before the fix.
\*
\* MinorityMustAgree = FALSE: with fewer than quorum devices at exactly
\* the mount's gen, the mount takes the content of any of them (the
\* implementation took the lowest device index). TLC MUST report
\* "Invariant MountKeepsPublished is violated": an orphan final beside the
\* acknowledged claim at that gen, and the mount picks the orphan.
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_pick_buggy.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3, d4}
    MaxCommits         = 2
    MaxFaults          = 0
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = FALSE
    RingRead           = FALSE
    RingCountsHidden   = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
