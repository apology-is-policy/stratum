SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyImmediateFree: writer skips the EBR retire ring and frees
\* superseded nodes directly into `reclaimed`. A reader pinned at
\* the previous epoch still holds those nodes in their view, so
\* the reclaim is observable as a use-after-free.
\* Expected: trips ReaderObservesCoherentTree.
CONSTANTS
    ReaderThreads             = {r0, r1}
    MaxNodes                  = 4
    MaxCommits                = 2
    MaxGlobalEpoch            = 5
    BuggyRetireBeforePublish  = FALSE
    BuggyImmediateFree        = TRUE
    BuggyNoPublish            = FALSE

INVARIANT TypeOK
INVARIANT RootAlwaysReachable
INVARIANT ReaderObservesCoherentTree
INVARIANT ReclaimBookkeeping
INVARIANT ReaderEpochStable
