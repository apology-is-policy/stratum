SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* RC-2 DEK-guard clean model: 2 readers, 3 deks (2 pre-installed so
\* the swap-with-last hazard is reachable in one mutation, 1 free for
\* install), 3 mutations, map pool 1 + MaxMuts.
CONSTANTS
    ReaderThreads       = {r0, r1}
    MaxDeks             = 3
    MaxSlots            = 3
    MaxMaps             = 4
    MaxMuts             = 3
    MaxGlobalEpoch      = 12
    BuggyInplaceMutate  = FALSE
    BuggyFreeOldMap     = FALSE
    BuggyEvictNoPublish = FALSE

INVARIANT TypeOK
INVARIANT ReaderGetsWanted
INVARIANT ReaderMapAlive
INVARIANT PublishedAlive
INVARIANT PublishedExcludesEvicted
INVARIANT MapRingConsistent
