\* Stratum vote 153 demonstration -- the mount before the fix (buggy).
\*
\* MountCountsUnknown = FALSE: the mount takes the highest gen a quorum
\* of the devices it can read reaches, and does not ask what a faulted
\* device could hold (compute_auth_gen over the scans that succeeded).
\* TLC MUST report "Invariant MountKeepsPublished is violated": a final
\* acknowledged by two devices of three, one of them faulted at the next
\* mount, which mounts the gen before it and writes its claim over the
\* other's copy (Stratum o1c round 2 F3, measured on the implementation).
\* MountAtAuthoritative is left out: it fails sooner, at a rollback past a
\* reservation, which loses nothing.
\*
\* To run:   java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -deadlock \
\*                -config quorum_mount_buggy.cfg quorum.tla
CONSTANTS
    Devices            = {d1, d2, d3}
    MaxCommits         = 1
    MaxFaults          = 1
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    MountCountsUnknown = FALSE
    MinorityMustAgree  = TRUE
    RingRead           = TRUE
    RingCountsHidden   = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountKeepsPublished
