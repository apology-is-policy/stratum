\* Stratum (r) round 1 F2 and OPEN-BUGS (ah) -- the mount's content pick,
\* four devices, with a fault: quorum_pick.cfg (two commits, no fault)
\* with one device fault and a third commit. Every invariant must hold.
\* TLC runs it for hours, past a CI job, so it is checked outside CI;
\* docs/reference/10-specs.md gives its count.
CONSTANTS
    Devices            = {d1, d2, d3, d4}
    MaxCommits         = 3
    MaxFaults          = 1
    MaxRetries         = 0
    IdempotentRetry    = TRUE
    StrictFinal        = TRUE
    MountCountsUnknown = TRUE
    MinorityMustAgree  = TRUE
    RingRead           = TRUE
    RingCountsHidden   = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
VIEW View

INVARIANTS
    TypeOK
    QuorumSafety
    AuthoritativeMono
    CommitAtomic
    OrphansNotAuthoritative
    LiveCoordTargetValid
    QuorumDurability
    MountGenBumpMulti
    MountAtAuthoritative
    MountKeepsPublished
    ContentQuorumAtGen
    MountNotStuck
    MountIntact
    NewestNearAuth
