\* L1/Larder content-version model — the healthy green run.
\*
\* EnableCversModel=TRUE exercises AllocFresh (cvers=0) / AllocReused
\* (cvers=prior+1, monotonic across reuse) / ContentMutate (cvers+=1,
\* gen UNCHANGED) + the CversUniqueAllTime uniqueness invariant + the
\* gen-decoupling (AllocatedReflectedInHistory). Orphan + inline models
\* OFF — the cvers logic is orthogonal, and keeping them off bounds the
\* state space. MaxGen=2 gives multiple reuse cycles; MaxCvers=3 gives
\* room for reuse (prior+1) after a couple of content mutations.
\*
\* Expected verdict: no invariant violation.
SPECIFICATION Spec

CONSTANTS
    Inos                         = {i1, i2}
    MaxGen                       = 2
    MaxNlink                     = 2
    BuggyReuseNoGenBump          = FALSE
    BuggyDoubleAllocate          = FALSE
    BuggyUnlinkLeavesZeroNlink   = FALSE
    EnableInlineDataModel        = FALSE
    MaxFileLen                   = 0
    MaxInline                    = 0
    BuggyTruncateReinlines       = FALSE
    BuggyInlineWriteSpills       = FALSE
    EnableOrphanModel            = FALSE
    BuggyAllocAnonClaimsLinked   = FALSE
    EnableCversModel             = TRUE
    MaxCvers                     = 3
    BuggyCversResetOnReuse       = FALSE
    BuggyContentMutateBumpsGen   = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    Invariants
