SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyNoPublish: writer retires the old root's superseded set
\* WITHOUT publishing a new root. mvcc_root continues to name the
\* old root, whose nodes are now being retired (and reclaimed at
\* the next-but-one epoch advance). Expected: trips
\* RootAlwaysReachable when mvcc_root's reachable set includes a
\* node now in the reclaimed set.
CONSTANTS
    ReaderThreads             = {r0, r1}
    MaxNodes                  = 4
    MaxCommits                = 2
    MaxGlobalEpoch            = 5
    BuggyRetireBeforePublish  = FALSE
    BuggyImmediateFree        = FALSE
    BuggyNoPublish            = TRUE

INVARIANT TypeOK
INVARIANT RootAlwaysReachable
INVARIANT ReaderObservesCoherentTree
INVARIANT ReclaimBookkeeping
INVARIANT ReaderEpochStable
