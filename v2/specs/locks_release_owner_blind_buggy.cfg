\* Buggy variant: Release drops the matching range of every owner, so
\* one owner's unlock frees another's lock. The invariants stay green (a
\* removal makes no conflict); DropsAreReleases fires once two owners
\* hold a shared lock on one range and one of them releases it. Runtime
\* twin: test_locks.c's locks_release_drops_only_its_owners_lock_there.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 1
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyReleaseOwnerBlind     = TRUE
    BuggyReleaseInoBlind       = FALSE

INVARIANTS
    Invariants

PROPERTY
    DropsAreReleases
