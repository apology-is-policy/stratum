\* Buggy: a rollback that does not raise gen_floor. A reuse after
\* it re-issues an (ino, gen) the discarded state issued -- the stale-fid
\* alias (a 9P fid bound to the discarded file passes the gen check on
\* the new one).
\*
\* Expected verdict: TupleUniqueAllTime (or GenMonotonicAcrossAllocations) violated.
SPECIFICATION Spec

CONSTANTS
    Inos                         = {i1, i2}
    MaxGen                       = 2
    MaxNlink                     = 1
    BuggyReuseNoGenBump          = FALSE
    BuggyDoubleAllocate          = FALSE
    BuggyUnlinkLeavesZeroNlink   = FALSE
    EnableInlineDataModel        = FALSE
    MaxFileLen                   = 0
    MaxInline                    = 0
    BuggyTruncateReinlines       = FALSE
    BuggyInlineWriteSpills       = FALSE
    EnableOrphanModel            = FALSE
    BuggyAllocAnonClaimsLinked   = FALSE
    EnableCversModel             = TRUE
    MaxCvers                     = 3
    BuggyCversResetOnReuse       = FALSE
    BuggyContentMutateBumpsGen   = FALSE
    EnableRollbackModel          = TRUE
    BuggyRollbackNoGenFloor      = TRUE
    BuggyRollbackNoCversFloor    = FALSE
    BuggyRollbackRewindsNextIno  = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOK
    TupleUniqueAllTime
    GenMonotonicAcrossAllocations
    AllocatedReflectedInHistory
    NoTwoAllocatedSameIno
    LinkedAllocatedHasPositiveNlink
    FreedHasZeroNlink
    DataKindMatchesState
    InlineLenBounded
    OneWayInlineToExtent
    OrphanHasZeroNlink
    CversUniqueAllTime
