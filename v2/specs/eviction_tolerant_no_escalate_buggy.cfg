\* TLY-A4: tolerant-mode timeout-without-escalation bug.
\*
\* BuggyToleratNoEscalate = TRUE enables TolerantEofNoEscalate (a
\* stutter step) and DISABLES the good ConsumerTolerantEscalate
\* transition. After TolerantTimeoutElapse fires, the consumer
\* never sets stop_flag → the
\* ConsumerAlwaysEscalatesOnPersistedEOF temporal property is
\* violated (TLC liveness check).
\*
\* Safety invariants AllInvariants still hold (no observable
\* violation in any single state); the failure is purely a liveness
\* one. This is the same shape as the writeback-spec's "buffer never
\* drains" buggy property.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    CorvusUsers              = {michael, susan}
    SessionUser              = michael
    Strict                   = FALSE
    BuggyOrdering            = FALSE
    BuggyNoDrain             = FALSE
    BuggyToleratNoEscalate   = TRUE

INVARIANTS
    AllInvariants

PROPERTIES
    ConsumerAlwaysEscalatesOnPersistedEOF
