SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyEvictNoPublish: evict builds the DEK-minus map and retires the
\* old one but never swings the published pointer. The still-published
\* old map keeps resolving the evicted DEK — the fail-closed-after-
\* evict contract (A-5 post-logout) is broken, and the published map
\* is in the retire ring headed for reclamation.
\* Expected: trips PublishedExcludesEvicted at the evict step (and
\* PublishedAlive once the ring drains, on longer traces).
CONSTANTS
    ReaderThreads       = {r0, r1}
    MaxDeks             = 3
    MaxSlots            = 3
    MaxMaps             = 4
    MaxMuts             = 3
    MaxGlobalEpoch      = 12
    BuggyInplaceMutate  = FALSE
    BuggyFreeOldMap     = FALSE
    BuggyEvictNoPublish = TRUE

INVARIANT TypeOK
INVARIANT ReaderGetsWanted
INVARIANT ReaderMapAlive
INVARIANT PublishedAlive
INVARIANT PublishedExcludesEvicted
INVARIANT MapRingConsistent
