\* L1/Larder — BuggyContentMutateBumpsGen counterexample.
\*
\* ContentMutate bumps gen as well as cvers — the fid-ESTALE-on-own-write
\* bug (a live 9P fid bound at gen G would ESTALE the moment the writer
\* commits its own write, because the server's fid-staleness check keys on
\* si_gen). The content-version (si_cvers) and the lifecycle generation
\* (si_gen) MUST stay decoupled: a write bumps cvers, never gen.
\*
\* Caught by the existing AllocatedReflectedInHistory: ContentMutate never
\* stamps `history` (only allocations do), so bumping gen[i] moves it to a
\* value with no matching history entry for that ino.
\*
\* Expected verdict: AllocatedReflectedInHistory VIOLATED (counterexample:
\* AllocFresh(i1) [gen 0, history {<<0,e>>}] → ContentMutate(i1) [gen→1,
\* no history entry with gen=1] → ALLOCATED i1 has gen=1 unrecorded).
SPECIFICATION Spec

CONSTANTS
    Inos                         = {i1, i2}
    MaxGen                       = 2
    MaxNlink                     = 2
    BuggyReuseNoGenBump          = FALSE
    BuggyDoubleAllocate          = FALSE
    BuggyUnlinkLeavesZeroNlink   = FALSE
    EnableInlineDataModel        = FALSE
    MaxFileLen                   = 0
    MaxInline                    = 0
    BuggyTruncateReinlines       = FALSE
    BuggyInlineWriteSpills       = FALSE
    EnableOrphanModel            = FALSE
    BuggyAllocAnonClaimsLinked   = FALSE
    EnableCversModel             = TRUE
    MaxCvers                     = 3
    BuggyCversResetOnReuse       = FALSE
    BuggyContentMutateBumpsGen   = TRUE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    Invariants
