SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyFlushReorders: flush applies messages newest-first; an
\* older write overwrites a newer one. Expected: trips
\* PerKeyNewestWins (via FlushPreservesNewestWins after the
\* buffer empties).
CONSTANTS
    Keys              = {1, 2}
    Values            = {a, b}
    Sep               = 2
    MaxBufferSize     = 2
    MaxOps            = 3
    BuggyFlushReorders = TRUE
    BuggyFlushDrops    = FALSE
    BuggyOverflow      = FALSE

INVARIANT TypeOK
INVARIANT BufferBounded
INVARIANT PerKeyNewestWins
INVARIANT FlushPreservesNewestWins
