\* dcache_provisional — BUGGY config: the design near-miss (entries born
\* provisional, but the publish's liveness check is a SEPARATE step from
\* the flip). TLC must find the four-party trace as a NoVisiblePostEvict
\* violation: p1 Resolve -> p2 Resolve -> p1 Insert -> p1 PublishCheck
\* (stale alive) -> EvictRemoveSlot -> EvictDrain (wipes p1's entry;
\* evict returns) -> p2 Insert (provisional, post-drain) ->
\* p1 PublishApply (stale ok flips p2's entry) — visible after evict
\* returned.
SPECIFICATION Spec
CONSTANTS
    Populators = {p1, p2}
    BuggyVisibleBirth = FALSE
    BuggySplitPublish = TRUE
INVARIANTS
    TypeOK
    NoVisiblePostEvict
