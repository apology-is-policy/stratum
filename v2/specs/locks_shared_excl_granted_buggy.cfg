\* P8-POSIX-7d buggy variant: Acquire's check (AcquireRefuses) lets a
\* SHARED and an EXCLUSIVE lock of different owners overlap, so two
\* conflicting locks coexist and NoConflictingLocks (which judges by
\* the healthy Conflicts) fires.
\*
\* Expected trace:
\*   Acquire(i1, o1, "shared",    0, 2)  → admitted
\*   Acquire(i1, o2, "exclusive", 0, 2)  → admitted (bug allows it)
\*   NoConflictingLocks fires on the now-coexisting pair.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 2
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = TRUE
    BuggyInoBlind              = FALSE

INVARIANTS
    TypeOK
    NoConflictingLocks
    ExclusiveExcludesDifferentOwner
    OwnLocksNeverRefuse
    DifferentInosNeverInteract
