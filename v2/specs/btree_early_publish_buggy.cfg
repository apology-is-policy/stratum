\* BuggyEarlyPublish: FinalCommit publishes the new root before every
\* planned node is written. Expected: trips DurableTreeWellFormed.
SPECIFICATION Spec
CONSTANTS
  MaxBegins = 3
  MaxContent = 2
  BuggyPartialCow = FALSE
  BuggyEarlyPublish = TRUE
  BuggyOverFree = FALSE
INVARIANT TypeOK
INVARIANT DurableTreeWellFormed
INVARIANT CommittedTreeMerkleConsistent
INVARIANT FreedNodesNotReachable
