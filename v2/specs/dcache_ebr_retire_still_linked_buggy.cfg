SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyRetireStillLinked: evict retires the entry into the ring
\* WITHOUT unlinking it from its bucket (the forgot-the-unlink sibling
\* of concurrency_mvcc's BuggyRetireBeforePublish). The entry stays
\* findable by new readers while the ring drains it, and reclamation
\* reaches a still-linked entry.
\* Expected: trips LinkedNeverReclaimed (structural; on longer traces
\* a fresh reader looks up the reclaimed-but-linked entry and
\* NoUseAfterReclaim fires too).
CONSTANTS
    ReaderThreads          = {r0, r1}
    MaxEntries             = 3
    MaxGlobalEpoch         = 12
    BuggyEvictFreesPinned  = FALSE
    BuggyLinkBeforeInit    = FALSE
    BuggyRetireStillLinked = TRUE

INVARIANT TypeOK
INVARIANT NoUseAfterReclaim
INVARIANT NoTornEntry
INVARIANT LinkedImpliesInit
INVARIANT LinkedNeverReclaimed
INVARIANT RingConsistent
