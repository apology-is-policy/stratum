\* Buggy demo (9.7-spec) — Rollback skips the R9-1 gen bump.
\* Expected: RollbackBumpsGen violated.
\*
\* Reachable trace: SnapshotCreate (snap 1 PRESENT, sync_gen=0).
\* Rollback(1) under BuggyRollbackSkipsGenBump=TRUE — the action's
\* second disjunct fires, sync_gen' = sync_gen (no bump), and
\* did_unbumped_rollback := TRUE. RollbackBumpsGen
\* (~did_unbumped_rollback) fires immediately.
\*
\* Models the impl bug v1's stm_snap_rollback (src/snap/snap.c::512;
\* docs/STRATUM.md §7.2) was designed to prevent: a rollback that
\* doesn't advance fs->gen before the allocator swap would allow a
\* (paddr, write_gen) AEAD-nonce collision between a pre-rollback
\* orphan and a post-rollback write at the same gen.
SPECIFICATION Spec

CONSTANTS
    MaxSnaps = 2
    MaxTxg = 4
    TreeRoots = {"r0", "r1"}
    BuggyDeleteWithHold = FALSE
    BuggyChainOutOfOrder = FALSE
    BuggyExtentTxgUnbounded = FALSE
    BuggyRollbackSkipsConsult = FALSE
    BuggyRollbackSkipsGenBump = TRUE

INVARIANTS
    RollbackBumpsGen
