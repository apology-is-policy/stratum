\* PX-10 snapshot rollback -- the healthy green run.
\*
\* TakeSnapshot / Rollback beside AllocFresh / AllocReused / Unlink /
\* ContentMutate, the cvers model on, inline and orphan off (the rollback
\* model snapshots the identity state only). A rollback raises gen_floor
\* and cvers_floor past the discarded state, so TupleUniqueAllTime and
\* CversUniqueAllTime hold across it.
\*
\* Expected verdict: no invariant violation.
SPECIFICATION Spec

CONSTANTS
    Inos                         = {i1, i2}
    MaxGen                       = 2
    MaxNlink                     = 1
    BuggyReuseNoGenBump          = FALSE
    BuggyDoubleAllocate          = FALSE
    BuggyUnlinkLeavesZeroNlink   = FALSE
    EnableInlineDataModel        = FALSE
    MaxFileLen                   = 0
    MaxInline                    = 0
    BuggyTruncateReinlines       = FALSE
    BuggyInlineWriteSpills       = FALSE
    EnableOrphanModel            = FALSE
    BuggyAllocAnonClaimsLinked   = FALSE
    EnableCversModel             = TRUE
    MaxCvers                     = 3
    BuggyCversResetOnReuse       = FALSE
    BuggyContentMutateBumpsGen   = FALSE
    EnableRollbackModel          = TRUE
    BuggyRollbackNoGenFloor      = FALSE
    BuggyRollbackNoCversFloor    = FALSE
    BuggyRollbackRewindsNextIno  = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOK
    TupleUniqueAllTime
    GenMonotonicAcrossAllocations
    AllocatedReflectedInHistory
    NoTwoAllocatedSameIno
    LinkedAllocatedHasPositiveNlink
    FreedHasZeroNlink
    DataKindMatchesState
    InlineLenBounded
    OneWayInlineToExtent
    OrphanHasZeroNlink
    CversUniqueAllTime
