\* TLY-A2: healthy multi-stratumd config — the canonical green run.
\*
\* Two clients (c1=michael, c2=susan) with uids 1 / 2; one admin uid 0
\* unused but in the model. Three datasets: sys, m, s. Pattern sets:
\*   c1 → {m}            (only michael's dataset)
\*   c2 → {s}            (only susan's dataset)
\* Coord policy:
\*   uid 0 → {sys}       (admin only sees system)
\*   uid 1 → {m}         (michael only sees his)
\*   uid 2 → {s}         (susan only sees hers)
\*
\* Both layers agree per uid for the c1=michael / c2=susan pair. TLC
\* explores every interleaving of dial / attach / op / crash /
\* legitimate-wedge / wedged-op. No invariants fire.
\*
\* State-space estimate: ~thousands of reachable states; check
\* completes in seconds.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Clients                = {c1, c2}
    Uids                   = {0, 1, 2}
    Datasets               = {sys, m, s}
    ClientUid              = [c1 |-> 1, c2 |-> 2]
    ClientPattern          = [c1 |-> {m}, c2 |-> {s}]
    CoordPolicy            = [0 |-> {sys}, 1 |-> {m}, 2 |-> {s}]
    MaxAttaches            = 1
    NoOwner                = NoOwner
    NoCause                = NoCause
    BuggyPatternSkipped    = FALSE
    BuggyAliasedFids       = FALSE
    BuggyCrashPropagates   = FALSE

INVARIANTS
    AllInvariants
