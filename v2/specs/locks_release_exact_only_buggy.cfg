    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 2
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyAcquireStacks         = FALSE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseDropsNothing   = FALSE
    BuggyReleaseInoBlind       = FALSE
    BuggyReleaseExactOnly      = TRUE

INVARIANTS
    Invariants

PROPERTY
    HeldBytesExact
