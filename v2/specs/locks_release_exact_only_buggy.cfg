\* Buggy variant: Release drops only a record with exactly its range --
\* the earlier table, under which SQLite's one two-byte unlock of
\* PENDING and RESERVED freed neither one-byte lock. The invariants stay
\* green; HeldBytesExact fires at the first partial release. Runtime
\* twin: test_locks.c's locks_release_trims_and_splits and
\* locks_sqlite_lock_sequence.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

