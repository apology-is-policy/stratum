\* TLY-A2: coord-policy-skipped bug. BuggyPatternSkipped = TRUE enables
\* the AttachWithoutCoordCheck transition.
\*
\* Configuration: client c1 has a TOO-PERMISSIVE pattern set {m, s} but
\* the coord's policy admits only c1=uid1→{m}. Under the buggy regime,
\* AttachWithoutCoordCheck fires for (c1, s) — client admits, coord
\* would refuse. TLC fires TattachPatternEnforced.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Clients                = {c1, c2}
    Uids                   = {0, 1, 2}
    Datasets               = {sys, m, s}
    ClientUid              = [c1 |-> 1, c2 |-> 2]
    ClientPattern          = [c1 |-> {m, s}, c2 |-> {s}]
    CoordPolicy            = [0 |-> {sys}, 1 |-> {m}, 2 |-> {s}]
    MaxAttaches            = 2
    NoOwner                = NoOwner
    NoCause                = NoCause
    BuggyPatternSkipped    = TRUE
    BuggyAliasedFids       = FALSE
    BuggyCrashPropagates   = FALSE

INVARIANTS
    AllInvariants
