    Populators = {p1, p2}
    BuggyVisibleBirth = FALSE
    BuggySplitPublish = FALSE
INVARIANTS
    TypeOK
    NoVisiblePostEvict
    NoStuckProvisional
PROPERTIES
    EventuallyAllDone
