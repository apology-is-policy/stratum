\* Buggy variant: Release removes nothing, so an unlock leaves the lock
\* held. The invariants stay green (a removal makes no conflict, and
\* neither does its absence); DropsAreReleases fires at the first release
\* of a held lock, a step it sees only because `last` changes. Runtime
\* twin: test_locks.c's locks_release_drops_only_its_owners_lock_there.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 1
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseDropsNothing   = TRUE
    BuggyReleaseInoBlind       = FALSE

INVARIANTS
    Invariants

PROPERTY
    DropsAreReleases
