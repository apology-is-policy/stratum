\* BUGGY: a swap whose second slot write fails leaves the half swap
\* (one child under both names, the other under none) without
\* reporting it -- no undo, or an undo failure not passed up -- so the
\* caller does not wedge and later actions (and a commit) run on it.
\*
\* Expected verdict: Invariants violated (IndexFaithfulUnlessTorn:
\* LookupAgreesWithLinks / SlotsAgreeWithLinks with torn FALSE).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Dirs                                = {d1}
    Names                               = {"n_a", "n_b", "n_c"}
    Inos                                = {ino_1, ino_2}
    MaxGen                              = 1
    MaxProbe                            = 3
    Hash                                <- HashAB_C
    NONE                                = NONE
    BuggyUnlinkUsesEmpty                = FALSE
    BuggyCreateOverwritesNoProbe        = FALSE
    BuggyLookupStopsOnTombstone         = FALSE
    BuggyReaddirIncludesTombstones      = FALSE
    BuggyReaddirNoCursorAdvance         = FALSE
    BuggyReaddirSkipsLiveRecord         = FALSE
    EnableWhiteoutModel                 = FALSE
    BuggyWhiteoutDropsName              = FALSE
    BuggyLookupReturnsRecordOnWhiteout  = FALSE
    EnableSwapFailModel                 = TRUE
    BuggySwapHalfUnreported             = TRUE

INVARIANTS
    Invariants
