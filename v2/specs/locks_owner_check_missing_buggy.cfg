\* Buggy variant: Acquire's check ignores the owner, so an owner's own
\* overlapping exclusive lock refuses its next acquire (no stacking,
\* no upgrade). Expected: OwnLocksNeverRefuse is violated once an
\* owner holds an exclusive lock. Runtime twin: test_locks.c's
\* locks_same_owner_overlapping_admitted.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 2
    BuggyOwnerCheckMissing     = TRUE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseInoBlind       = FALSE

INVARIANTS
    TypeOK
    NoConflictingLocks
    ExclusiveExcludesDifferentOwner
    OwnLocksNeverRefuse
    DifferentInosNeverInteract
