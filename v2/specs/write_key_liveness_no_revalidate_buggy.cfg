\* write_key_liveness — BUGGY config: the naive three-phase split
\* (Phase 3 indexes WITHOUT re-validating the resolved key). TLC must
\* find the RC-3 design-review race as a NoDeadKeyIndexed violation:
\*   Resolve(K1) -> Rotate (K1 RETIRED) -> Sweep(K1) (zero refs — the
\*   in-flight write is invisible) -> CommitBuggy indexes K1, whose
\*   durable wrapped key is gone.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    MaxKeys = 4
    BuggyNoRevalidate = TRUE
INVARIANTS
    TypeOK
    NoDeadKeyIndexed
