\* TLY-A4: eviction-ordering bug.
\*
\* BuggyOrdering = TRUE enables the UnmountBeforeStop transition, which
\* fires unmount from main_state=Serving WITHOUT observing stop_flag.
\* TLC should fire StopBeforeUnmount within a few states (the first
\* reachable interleaving with WorkloadEnqueueWrite → WorkloadFlush →
\* UnmountBeforeStop violates the invariant via the history shadow
\* capturing stop_flag = FALSE at the transition).

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    CorvusUsers              = {michael, susan}
    SessionUser              = michael
    Strict                   = FALSE
    BuggyOrdering            = TRUE
    BuggyNoDrain             = FALSE
    BuggyToleratNoEscalate   = FALSE

INVARIANTS
    AllInvariants
