\* Buggy variant: Acquire's check compares ranges without the ino, so a
\* lock on one file refuses an acquire on another. NoConflictingLocks
\* cannot see this (a refusal adds nothing); DifferentInosNeverInteract
\* fires after the first acquire. Runtime twin: test_locks.c's
\* locks_acquire_different_inos_admitted (and, for incarnations,
\* locks_other_incarnation_never_conflicts).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1, i2}
    Owners                     = {o1, o2}
    MaxOff                     = 1
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = TRUE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseDropsNothing   = FALSE
    BuggyReleaseInoBlind       = FALSE

INVARIANTS
    TypeOK
    NoConflictingLocks
    ExclusiveExcludesDifferentOwner
    OwnLocksNeverRefuse
    DifferentInosNeverInteract
