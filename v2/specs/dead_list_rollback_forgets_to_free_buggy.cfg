\* Buggy demo (9.7-spec) — Rollback doesn't add diverged blocks to `freed`.
\* Expected: BlocksTrackedSomewhere violated.
\*
\* Reachable trace: WriteBlock(1) (live={1}, used={1}). SnapCreate
\* (snap 1 PRESENT, snap_view_blocks[1]={1}). WriteBlock(2) (live={1,2},
\* used={1,2}). Rollback(1) under BuggyRollbackForgetsToFree=TRUE:
\* live={1}, but block 2 (which was in `to_free`) is NEITHER added to
\* `freed` (the buggy variant skips that) NOR in any snap's dead-list.
\* BlocksTrackedSomewhere fires for b=2.
\*
\* Models the impl bug: a rollback handler that resets the dataset's
\* tree_root + clears newer-snap state but forgets to plumb the
\* diverged blocks into the allocator's free-list. They leak — storage
\* is permanently lost.
SPECIFICATION Spec
INVARIANT BlocksTrackedSomewhere

CONSTANTS
    MaxBlocks = 3
    MaxSnaps = 2
    MaxColdExtents = 2
    MaxHashIds = 2
    BuggyOverwriteForgetsDead = FALSE
    BuggyDeleteForgetsFree = FALSE
    BuggyMergeIncludesFreed = FALSE
    BuggyOverwriteColdForgetsDead = FALSE
    BuggyDeleteColdForgetsDeref = FALSE
    BuggyRollbackForgetsToFree = TRUE
    BuggyRollbackKeepsNewerSnaps = FALSE
