SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyOverflow: Insert / Delete may append past MaxBufferSize.
\* Expected: trips BufferBounded as soon as a third message
\* appends without an intervening flush.
CONSTANTS
    Keys              = {1, 2}
    Values            = {a, b}
    Sep               = 2
    MaxBufferSize     = 2
    MaxOps            = 3
    BuggyFlushReorders = FALSE
    BuggyFlushDrops    = FALSE
    BuggyOverflow      = TRUE

INVARIANT TypeOK
INVARIANT BufferBounded
INVARIANT PerKeyNewestWins
INVARIANT FlushPreservesNewestWins
