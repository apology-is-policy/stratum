\* TLY-A3-keyslot buggy config — demonstrates the failure mode
\* MountResolvesKeyBeforeData exists to catch.
\*
\* BuggyServeBeforeResolve = TRUE enables the ServeBeforeResolve
\* action: a mount serves a data block while still in the RESOLVING
\* state — i.e. before the CURRENT keyslot has been resolved. For a
\* CORVUS-wrapped dataset that means plaintext is handed out before
\* the corvus UNWRAP has succeeded (or before it has been shown to
\* fail). TLC trips MountResolvesKeyBeforeData and the counterexample
\* trace is a dataset with data_served = TRUE while mount = RESOLVING
\* — the half-mount the fail-fast property forbids.
\*
\* Same Datasets / MaxKeyId / MaxRefs bounds as the fixed config.
CONSTANTS
    Datasets  = {0, 1}
    MaxKeyId  = 3
    MaxRefs   = 2
    BuggyServeBeforeResolve = TRUE

SPECIFICATION Spec

INVARIANT Invariants
