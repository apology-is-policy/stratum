\* P8-POSIX-9b: Whiteout action converts slot to TOMBSTONE instead
\* of WHITEOUT, dropping the name field. Chain integrity and the
\* links view are both preserved (the name is gone either way); the
\* observable failure is at the readdir emission layer: tombstones
\* aren't emitted, so overlayfs userspace would miss the whiteout
\* marker at the source name post-rename.
\*
\* Expected verdict: Invariants violated (WhiteoutsAgreeWithOracle:
\* the oracle `whited` holds the name, no whiteout slot does) in 3
\* steps. The runtime side is pinned too, by test_dirent.c and
\* test_fs_phase8.c (rename_whiteout_emits_in_readdir,
\* readdir_emits_whiteout_with_correct_type).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Dirs                                = {d1}
    Names                               = {"n_a", "n_b", "n_c"}
    Inos                                = {ino_1, ino_2}
    MaxGen                              = 1
    MaxProbe                            = 3
    Hash                                <- HashAB_C
    NONE                                = NONE
    BuggyUnlinkUsesEmpty                = FALSE
    BuggyCreateOverwritesNoProbe        = FALSE
    BuggyLookupStopsOnTombstone         = FALSE
    BuggyReaddirIncludesTombstones      = FALSE
    BuggyReaddirNoCursorAdvance         = FALSE
    BuggyReaddirSkipsLiveRecord         = FALSE
    EnableWhiteoutModel                 = TRUE
    BuggyWhiteoutDropsName              = TRUE
    BuggyLookupReturnsRecordOnWhiteout  = FALSE
    EnableSwapFailModel                 = FALSE
    BuggySwapHalfUnreported             = FALSE
    BuggyCreateLeavesOwnWhiteout        = FALSE

INVARIANTS
    Invariants
