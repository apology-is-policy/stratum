SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* BuggyFreeOldMap: the mutator COW-publishes the new map but frees
\* the superseded one immediately instead of EBR-retiring it — the
\* free-under-reader UAF (the same class as sync_dek_grow's realloc
\* freeing the array a lockless reader is walking).
\* Expected: trips ReaderMapAlive (a pinned reader's loaded snapshot
\* is reclaimed under it).
CONSTANTS
    ReaderThreads       = {r0, r1}
    MaxDeks             = 3
    MaxSlots            = 3
    MaxMaps             = 4
    MaxMuts             = 3
    MaxGlobalEpoch      = 12
    BuggyInplaceMutate  = FALSE
    BuggyFreeOldMap     = TRUE
    BuggyEvictNoPublish = FALSE

INVARIANT TypeOK
INVARIANT ReaderGetsWanted
INVARIANT ReaderMapAlive
INVARIANT PublishedAlive
INVARIANT PublishedExcludesEvicted
INVARIANT MapRingConsistent
