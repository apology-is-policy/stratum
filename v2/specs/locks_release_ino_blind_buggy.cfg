\* Buggy variant: Release drops the owner's matching range on every
\* inode. The invariants stay green; DropsAreReleases fires once an owner
\* holds the range on two inodes and some other lock besides. Runtime
\* twin: test_locks.c's locks_release_drops_only_its_owners_lock_there.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1, i2}
    Owners                     = {o1}
    MaxOff                     = 1
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseDropsNothing   = FALSE
    BuggyReleaseInoBlind       = TRUE

INVARIANTS
    Invariants

PROPERTY
    DropsAreReleases
