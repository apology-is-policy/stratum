\* L1/Larder — BuggyCversResetOnReuse counterexample.
\*
\* AllocReused resets cvers to 0 instead of prior+1. A reused ino then
\* re-stamps a content-version (0) that its AllocFresh already published,
\* so CversUniqueAllTime fires: two distinct content-defining events on
\* one ino carry the same cvers → a Larder entry keyed on (ino) +
\* validated on (cvers) aliases the prior incarnation's cached bytes
\* (the stale-serve collision I-38 forbids).
\*
\* Expected verdict: CversUniqueAllTime VIOLATED (counterexample:
\* AllocFresh(i1) [cvers 0] → Unlink(i1) [FREED, cvers preserved] →
\* AllocReused(i1) [reset cvers to 0] → two cvers=0 stamps for i1).
SPECIFICATION Spec

CONSTANTS
    Inos                         = {i1, i2}
    MaxGen                       = 2
    MaxNlink                     = 2
    BuggyReuseNoGenBump          = FALSE
    BuggyDoubleAllocate          = FALSE
    BuggyUnlinkLeavesZeroNlink   = FALSE
    EnableInlineDataModel        = FALSE
    MaxFileLen                   = 0
    MaxInline                    = 0
    BuggyTruncateReinlines       = FALSE
    BuggyInlineWriteSpills       = FALSE
    EnableOrphanModel            = FALSE
    BuggyAllocAnonClaimsLinked   = FALSE
    EnableCversModel             = TRUE
    MaxCvers                     = 3
    BuggyCversResetOnReuse       = TRUE
    BuggyContentMutateBumpsGen   = FALSE

CHECK_DEADLOCK
    FALSE

INVARIANTS
    Invariants
