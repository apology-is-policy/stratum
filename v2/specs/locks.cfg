\* P8-POSIX-7d: healthy lock-table config.
\*
\* One ino, two owners, MaxOff=2: ranges that nest, partly overlap and
\* abut, every same-owner stack, every different-owner pair. Locks on
\* different inos never interact (Overlaps needs the same ino);
\* locks_two_inos.cfg checks that. The earlier bound (two inos,
\* MaxOff=4) did not finish: 16.6M distinct states at 10 minutes with
\* the queue still growing.
\*
\* Expected verdict: TLC explores all interleavings without firing
\* any of Invariants.
\*
\* CHECK_DEADLOCK FALSE: with locks = {} and Acquire's preconditions
\* satisfied for many parameter combinations, terminal states only
\* arise when the bounded state space is exhausted — TLC sees this
\* as "no enabled action" without the override.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Inos                       = {i1}
    Owners                     = {o1, o2}
    MaxOff                     = 2
    BuggyOwnerCheckMissing     = FALSE
    BuggyShared_Excl_Granted   = FALSE
    BuggyInoBlind              = FALSE
    BuggyAcquireStacks         = FALSE
    BuggyReleaseOwnerBlind     = FALSE
    BuggyReleaseDropsNothing   = FALSE
    BuggyReleaseInoBlind       = FALSE
    BuggyReleaseExactOnly      = FALSE

INVARIANTS
    Invariants

PROPERTY
    HeldBytesExact
