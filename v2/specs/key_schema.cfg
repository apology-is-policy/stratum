\* P4-4c: Datasets widened to {0, 1} now that the impl supports
\* per-dataset rotation + sweep. Dataset 0 is the pool metadata key;
\* dataset 1 exercises the rotation path without touching the
\* metadata AEAD layer (Phase 6 wires the extent layer to additional
\* dataset IDs). MaxKeyId=3 and MaxRefs=2 keep the schema state
\* space modest.
\*
\* TLY-A3-keyslot (2026-05-15): the spec gained the `wrapper`
\* dimension + the mount state machine (mount / data_served /
\* unwrap_avail). The reachable-state count grows beyond the
\* pre-TLY-A3 ~20k accordingly; a tooling-gated TLC run should
\* expect a larger graph. BuggyServeBeforeResolve is FALSE here
\* (the fixed config); the buggy variant lives in
\* key_schema_mount_serve_before_resolve_buggy.cfg.
CONSTANTS
    Datasets  = {0, 1}
    MaxKeyId  = 3
    MaxRefs   = 2
    BuggyServeBeforeResolve = FALSE
    BuggyUnwrapWrongPath    = FALSE

SPECIFICATION Spec

INVARIANT Invariants
