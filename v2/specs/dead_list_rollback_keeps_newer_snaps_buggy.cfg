\* Buggy demo (9.7-spec) — Rollback leaves newer-than-s snaps PRESENT.
\* Expected: SnapViewConsistent violated.
\*
\* Reachable trace: WriteBlock(1) (live={1}). SnapCreate (snap 1 PRESENT,
\* snap_view_blocks[1]={1}). WriteBlock(2) (live={1,2}). SnapCreate
\* (snap 2 PRESENT, snap_view_blocks[2]={1,2}). Rollback(1) under
\* BuggyRollbackKeepsNewerSnaps=TRUE: live={1}, snap_state[2] stays
\* PRESENT, but block 2 ends up in `freed` (the to_free pass routes it
\* there). SnapViewConsistent (PRESENT s ⇒ snap_view_blocks[s] ∩ freed = ∅)
\* fires for s=2 with block 2 in the intersection.
\*
\* Models the impl bug: a rollback handler that swaps di_tree_root but
\* forgets to mark newer snaps ABSENT. The stale snap entries now
\* reference freed storage; a read from such a stale snap would return
\* corrupt or reallocated data.
SPECIFICATION Spec
INVARIANT SnapViewConsistent

CONSTANTS
    MaxBlocks = 3
    MaxSnaps = 2
    MaxColdExtents = 2
    MaxHashIds = 2
    BuggyOverwriteForgetsDead = FALSE
    BuggyDeleteForgetsFree = FALSE
    BuggyMergeIncludesFreed = FALSE
    BuggyOverwriteColdForgetsDead = FALSE
    BuggyDeleteColdForgetsDeref = FALSE
    BuggyRollbackForgetsToFree = FALSE
    BuggyRollbackKeepsNewerSnaps = TRUE
