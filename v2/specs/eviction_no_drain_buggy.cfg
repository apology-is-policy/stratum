\* TLY-A4: no-drain bug.
\*
\* BuggyNoDrain = TRUE enables UnmountWithoutDrain, which fires
\* unmount with drain_pending = TRUE. TLC should fire
\* InFlightWritesDrainBeforeUnmount on any reachable state where
\* the enqueue-write fires before the unmount.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    CorvusUsers              = {michael, susan}
    SessionUser              = michael
    Strict                   = FALSE
    BuggyOrdering            = FALSE
    BuggyNoDrain             = TRUE
    BuggyToleratNoEscalate   = FALSE

INVARIANTS
    AllInvariants
