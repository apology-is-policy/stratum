\* Buggy demo (TLY-A5) — Rollback skips the marker-consultation gate.
\* Expected: RollbackBlockedIffCompromised violated.
\*
\* Reachable trace: SnapshotCreate (snap 1 PRESENT). MarkCompromised(1)
\* (snap_compromised[1] = TRUE). Rollback(1) under
\* BuggyRollbackSkipsConsult = TRUE with force = FALSE — the gate is
\* bypassed, the action proceeds, and did_unsafe_rollback is set TRUE
\* because (snap_compromised[1] /\ ~force) holds. RollbackBlockedIff-
\* Compromised (~did_unsafe_rollback) fires.
\*
\* Models the impl bug the A5 marker exists to prevent: a rollback
\* path that does not consult the STM_SNAP_FLAG_ROLLBACK_COMPROMISED
\* flag, resurrecting a possibly-compromised wrap chain (F13).
SPECIFICATION Spec

CONSTANTS
    MaxSnaps = 2
    MaxTxg = 4
    TreeRoots = {"r0", "r1"}
    BuggyDeleteWithHold = FALSE
    BuggyChainOutOfOrder = FALSE
    BuggyExtentTxgUnbounded = FALSE
    BuggyRollbackSkipsConsult = TRUE

INVARIANTS
    RollbackBlockedIffCompromised
