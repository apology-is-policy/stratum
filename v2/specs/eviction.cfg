\* TLY-A4: healthy eviction config — the canonical green run.
\*
\* Two corvus users (the user this stratumd is bound to + one other),
\* tolerant-mode by default (Strict = FALSE). All buggy flags off; TLC
\* explores every interleaving of consumer / workload / main-thread
\* transitions.
\*
\* Expected verdict: AllInvariants holds + the
\* ConsumerAlwaysEscalatesOnPersistedEOF liveness property holds. The
\* state space is tiny (< 10K states); check completes in seconds.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    CorvusUsers              = {michael, susan}
    SessionUser              = michael
    Strict                   = FALSE
    BuggyOrdering            = FALSE
    BuggyNoDrain             = FALSE
    BuggyToleratNoEscalate   = FALSE

INVARIANTS
    AllInvariants

PROPERTIES
    ConsumerAlwaysEscalatesOnPersistedEOF
