SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* Smallest instance that exhibits the multi-node MVCC ordering
\* race: 2 readers, 4 nodes (initial id=1 + up to 3 fresh commits),
\* 2 commits, 3 epochs. Finishes in a few seconds.
CONSTANTS
    ReaderThreads             = {r0, r1}
    MaxNodes                  = 4
    MaxCommits                = 2
    MaxGlobalEpoch            = 5
    BuggyRetireBeforePublish  = FALSE
    BuggyImmediateFree        = FALSE
    BuggyNoPublish            = FALSE

INVARIANT TypeOK
INVARIANT RootAlwaysReachable
INVARIANT ReaderObservesCoherentTree
INVARIANT ReclaimBookkeeping
INVARIANT ReaderEpochStable
